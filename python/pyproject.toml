[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alia-sdk"
version = "0.2.2"
description = "Alia Pad cart SDK: manifests, saves, .acart files and the acart tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"   # 3.13 is the handheld's
dependencies = []

[project.optional-dependencies]
sign = ["cryptography>=41"]     # acart keygen, pack --key, signature checks
local = ["dbus-fast>=2"]        # acart without --board, against a session on this machine

[project.scripts]
acart = "alia.acart:main"

[project.urls]
Homepage = "https://github.com/NU-Hachimi/alia-devkit"

[tool.setuptools]
packages = ["alia"]

[tool.setuptools.package-data]
alia = ["platform.toml", "runtime.toml"]
